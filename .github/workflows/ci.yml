name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # lib-builder build ignores compiler errors, so this is what fails on them
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:ci
      - run: pnpm test:package
      - run: pnpm size

  # builds on the current Node, and checks the packed package on the oldest one `engines` promises
  package-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: minimum
        run: echo "node=$(node -p "require('./package.json').engines.node.replace('>=', '')")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.minimum.outputs.node }}
      - run: node scripts/check-package.mjs

  variance:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the checkout, and the badge
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the review reads the change from where it starts
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # the CLI needs 22.15 or newer
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: Variance-Authority/variance-authority/.github/actions/variance/review@7cc5fee52081a01971529320d5ca3b310caa2188 # TODO: Variance-Authority/action/review@v1 once released
        with:
          suite: unit
          test: pnpm exec jest
          badge: 'true'
